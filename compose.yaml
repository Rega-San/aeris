name: aeris
services:
  frontend:
    build: ./frontend
    image: aeris-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: backend:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build: ./backend
    image: aeris-backend:local
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aeris}
      POSTGRES_USER: ${POSTGRES_USER:-aeris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copiez .env.example en .env et définissez POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeris}
      POSTGRES_USER: ${POSTGRES_USER:-aeris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres_data:
